name: iOS app build

on:
  workflow_dispatch:
  push:
    paths:
      - 'EFootballAssistant.xcodeproj/**'
      - 'Sources/**'
      - 'Config/**'
      - '.github/workflows/ios-app-build.yml'

jobs:
  build:
    runs-on: macos-14
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      EXPECTED_IOS_TEAM_ID: UWMJ7ZLK3T
      EXPECTED_IOS_BUNDLE_ID: app.coconut9292.caracal4431
    steps:
      - uses: actions/checkout@v4

      - name: Validate and install Apple signing certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IOS_CERTIFICATE_P12_BASE64"
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_BUNDLE_ID"
          test "$IOS_TEAM_ID" = "$EXPECTED_IOS_TEAM_ID"
          test "$IOS_BUNDLE_ID" = "$EXPECTED_IOS_BUNDLE_ID"
          KEYCHAIN_PATH="$RUNNER_TEMP/efootball-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12_PATH="$RUNNER_TEMP/apple-signing.p12"
          IMPORT_LOG="$RUNNER_TEMP/p12-import.log"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12_PATH"
          test -s "$P12_PATH"
          P12_BYTES="$(wc -c < "$P12_PATH" | tr -d '[:space:]')"
          P12_SHA256="$(shasum -a 256 "$P12_PATH" | awk '{print $1}')"
          echo "P12_FILE_EXISTS=YES"
          echo "P12_SIZE_BYTES=$P12_BYTES"
          echo "P12_SHA256=$P12_SHA256"
          if file "$P12_PATH" | grep -Eiq 'PKCS|certificate|data'; then
            echo "P12_RECOGNIZED=YES"
          else
            echo "P12_RECOGNIZED=UNKNOWN"
          fi
          if openssl pkcs12 -info -noout -passin env:IOS_CERTIFICATE_PASSWORD < "$P12_PATH" > "$IMPORT_LOG" 2>&1; then
            echo "P12_OPENSSL_PASSWORD_CHECK=SUCCESS"
          else
            echo "P12_OPENSSL_PASSWORD_CHECK=ERROR"
            if grep -Eiq 'mac verify error|invalid password|mac verification' "$IMPORT_LOG"; then
              echo "P12_OPENSSL_EVIDENCE=PASSWORD_OR_FILE_MAC_FAILURE"
            else
              echo "P12_OPENSSL_EVIDENCE=FORMAT_OR_PASSWORD_FAILURE"
            fi
            exit 1
          fi
          if openssl pkcs12 -in "$P12_PATH" -nocerts -nodes -passin env:IOS_CERTIFICATE_PASSWORD 2> "$IMPORT_LOG" | grep -q 'PRIVATE KEY'; then
            echo "P12_PRIVATE_KEY_PRESENT=YES"
          else
            echo "P12_PRIVATE_KEY_PRESENT=NO_OR_UNREADABLE"
          fi
          openssl pkcs12 -in "$P12_PATH" -clcerts -nokeys -passin env:IOS_CERTIFICATE_PASSWORD 2> "$IMPORT_LOG" \
            | openssl x509 -noout -subject -issuer -serial -dates 2> "$IMPORT_LOG" \
            | sed -E 's/(subject=|issuer=|serial=|notBefore=|notAfter=)/\1/'
          echo "P12_CERTIFICATE_METADATA_READ=YES"
          NORMALIZED_P12="$RUNNER_TEMP/apple-signing-normalized.p12"
          NORMALIZED_PASSWORD="$(uuidgen)"
          export NORMALIZED_PASSWORD
          if ! openssl pkcs12 -in "$P12_PATH" -nodes -passin env:IOS_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/p12-material.pem" 2> "$IMPORT_LOG"; then
            echo "P12_NORMALIZATION=ERROR_READING_PKCS12"
            grep -Eio 'error[^[:cntrl:]]*|bad decrypt|mac verify error|unsupported[^[:cntrl:]]*|unknown option' "$IMPORT_LOG" | head -5 || true
            exit 1
          fi
          if ! openssl pkcs12 -export -legacy -in "$RUNNER_TEMP/p12-material.pem" -out "$NORMALIZED_P12" -passout env:NORMALIZED_PASSWORD -name "EFootball Signing" 2> "$IMPORT_LOG"; then
            echo "P12_NORMALIZATION=ERROR_REPACKAGING_PKCS12"
            grep -Eio 'error[^[:cntrl:]]*|bad decrypt|mac verify error|unsupported[^[:cntrl:]]*|unknown option' "$IMPORT_LOG" | head -5 || true
            exit 1
          fi
          if security import "$NORMALIZED_P12" -P "$NORMALIZED_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign > "$IMPORT_LOG" 2>&1; then
            echo "P12_KEYCHAIN_IMPORT=SUCCESS"
            echo "P12_IMPORT_METHOD=OPENSSL_NORMALIZED_PKCS12"
          else
            echo "P12_KEYCHAIN_IMPORT=ERROR"
            if grep -Eiq 'MAC verification|wrong password|SecKeychainItemImport' "$IMPORT_LOG"; then
              echo "P12_KEYCHAIN_EVIDENCE=PASSWORD_OR_FILE_MAC_FAILURE"
            else
              echo "P12_KEYCHAIN_EVIDENCE=MACOS_KEYCHAIN_REJECTION"
            fi
            exit 1
          fi
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Validate and install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/efootball.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/efootball.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$PROFILE_PLIST")"
          PROFILE_TEAM_ID="$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")"
          test "$PROFILE_TEAM_ID" = "$EXPECTED_IOS_TEAM_ID"
          test "$PROFILE_APP_ID" = "$EXPECTED_IOS_TEAM_ID.$EXPECTED_IOS_BUNDLE_ID"
          cp "$RUNNER_TEMP/efootball.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Build iOS simulator target without signing
        run: >-
          xcodebuild -project EFootballAssistant.xcodeproj
          -scheme EFootballAssistant
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Archive iOS device target without signing
        run: >-
          xcodebuild -project EFootballAssistant.xcodeproj
          -scheme EFootballAssistant
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/EFootballAssistant.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Archive signed iOS device target
        run: >-
          xcodebuild -project EFootballAssistant.xcodeproj
          -scheme EFootballAssistant
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/EFootballAssistant-signed.xcarchive
          DEVELOPMENT_TEAM="$IOS_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
          PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID"
          CODE_SIGN_ENTITLEMENTS=Config/EFootballAssistant.entitlements
          CODE_SIGN_STYLE=Manual
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=YES
          archive

      - name: Package unsigned device archive
        run: |
          mkdir -p build/Payload
          cp -R build/EFootballAssistant.xcarchive/Products/Applications/EFootballAssistant.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent \
            build/Payload \
            build/EFootballAssistant-unsigned.ipa
          ditto -c -k --sequesterRsrc --keepParent \
            build/EFootballAssistant.xcarchive \
            build/EFootballAssistant-unsigned.xcarchive.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/EFootballAssistant.xcarchive/Products/Applications/EFootballAssistant.app \
            build/EFootballAssistant-unsigned.app.zip
          mkdir -p build/SignedPayload
          cp -R build/EFootballAssistant-signed.xcarchive/Products/Applications/EFootballAssistant.app build/SignedPayload/
          ditto -c -k --sequesterRsrc --keepParent \
            build/SignedPayload \
            build/EFootballAssistant-signed.ipa

      - name: Validate signed app
        run: |
          set -euo pipefail
          APP="build/EFootballAssistant-signed.xcarchive/Products/Applications/EFootballAssistant.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier=|TeamIdentifier=|Authority='
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EFootballAssistant-iOS-unsigned
          path: |
            build/EFootballAssistant-unsigned.ipa
            build/EFootballAssistant-unsigned.xcarchive.zip
            build/EFootballAssistant-unsigned.app.zip
            build/EFootballAssistant-signed.ipa
            build/simulator/Build/Products/Debug-iphonesimulator/EFootballAssistant.app
          if-no-files-found: error
